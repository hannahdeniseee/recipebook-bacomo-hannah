{% extends 'base.html' %}

{% block content %}
<h2>Upload an Image for {{ object.name }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <a href="{% url 'ledger:recipe-list' %}">Back to Recipe</a>
    {{ form.as_p }}
    <button type="submit">Submit</button>
</form>


{% endblock %}
