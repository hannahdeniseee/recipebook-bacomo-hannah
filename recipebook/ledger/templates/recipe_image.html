{% extends 'base.html' %}

{% block content %}
<h2>Upload an Image for {{ object.name }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>

<a href="{% url 'ledger:recipe-detail' object.pk %}">Back to Recipe</a>
{% endblock %}
