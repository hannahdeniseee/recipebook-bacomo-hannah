{% extends 'base.html' %}

{% block content %}
<h3>{{ object.name }}</h3>
<ul>
    {% for recipe_ingredient in object.ingredients.all %}
        <img src="{{ object.task_image.url }}" alt=recipe_ingredient.ingredient.name>
        <li>{{ recipe_ingredient.quantity }} of {{ recipe_ingredient.ingredient.name }}</li>
    {% endfor %}
</ul>
<a href="{% url 'ledger:recipe-list' %}">Back to Recipe List</a>

{% endblock %}
