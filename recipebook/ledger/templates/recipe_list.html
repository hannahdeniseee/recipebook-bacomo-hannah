{% extends 'base.html' %}

{% block content %}
<ul>
    {% for recipe in object_list %}
        <li><a href="{% url 'ledger:recipe-detail' recipe.id %}">{{ recipe.name }}</a></li>
    {% empty %}
        <li>DEBUG: No recipes found.</li>
    {% endfor %}
</ul>

{% if user.is_authenticated %}
    <a href="{% url 'ledger:add-recipe' %}">Add New Recipe</a>
{% endif %}

{% endblock %}
