{% extends 'base.html' %}

{% block content %}
  <h2>Add a New Recipe</h2>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Add Recipe</button>
  </form>

  {% if object %}
    <a href="{% url 'ledger:add-recipe-image' object.pk %}">Upload Image</a>
  {% endif %}


{% endblock %}
